[package]
name = "mint-pulse"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
description = "Lightweight CPU, RAM, swap and filesystem graphs for the Cinnamon system tray"
license = "MIT"
repository = "https://github.com/SamZaitcev/mint-pulse"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
